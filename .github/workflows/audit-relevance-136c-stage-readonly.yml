# Single-purpose read-only stage audit; no Cloudflare traffic change.
name: Relevance 136c immutable stage audit (READ ONLY)

on:
  push:
    branches:
      - audit/relevance-136c-readonly-stage

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout unchanged main and diagnostic
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Canonical checks
        run: python3 scripts/check-project-invariants.py
      - name: Authenticated Cloudflare read-only metadata and asset check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/audit_relevance_136c_stage.py
