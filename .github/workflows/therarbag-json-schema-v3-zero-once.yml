# One-shot finite diagnostic: original source JSON root vs wrapped shape.
# Offline stage V3 assertions synchronized with finite enum classifier.
# Existing Cloudflare 36019925 must remain 100%, v2 diagnostic is 0%.
# Uploads a reviewed V3 0% replacement only; no main push or live rollout.
name: TheRarBg Original JSON Schema V3 Zero Only
on:
  push:
    branches:
      - diagnostics/therarbag-cloudflare-json-egress-20261024
    paths:
      - .github/workflows/therarbag-json-schema-v3-zero-once.yml
permissions:
  contents: read
concurrency:
  group: magnetra-therarbag-json-schema-v3-zero-once
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'Zuzuitu/AlexLab-Magnetra'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline source-provenance checks and finite diagnostic tests
        run: |
          set -euo pipefail
          python3 scripts/check-project-invariants.py
          python3 -m py_compile scripts/stage_therarbag_json_probe_zero_20261024.py scripts/probe_therarbag_cf_json_stage_v3_20261024.py
          node --test worker/test/therarbag-source-json-stage.test.mjs
          node --test worker/test/therarbag-original-json-fallback.test.mjs
      - name: GET-only Cloudflare baseline binding and version audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/inspect_companion_binding_readonly.py
      - name: Replace only exact zero-percent V2 slot with V3
        id: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          THERARBAG_STAGE_APPROVAL: ZERO_ONLY_EXACT_36019925
        run: python3 scripts/stage_therarbag_json_probe_zero_20261024.py
      - name: Verify V3 original JSON envelope in actual Cloudflare egress
        env:
          CANDIDATE: ${{ steps.stage.outputs.candidate }}
        run: python3 scripts/probe_therarbag_cf_json_stage_v3_20261024.py "$CANDIDATE"
