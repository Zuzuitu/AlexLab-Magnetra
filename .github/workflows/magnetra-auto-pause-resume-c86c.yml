# Owner-manual only: resumes already staged c86c version. NO upload/redeploy.
name: Magnetra Resume Verified Auto-Pause c86c 100% (MANUAL)
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        description: "Resume known 0% candidate or separate exact manual rollback"
        options:
          - CANCEL
          - CONFIRM_RESUME_VERIFIED_C86C_100
          - CONFIRM_RESTORE_136C_FROM_C86C_100
        default: CANCEL

permissions:
  contents: read

concurrency:
  group: magnetra-production-traffic-change
  cancel-in-progress: false

jobs:
  resume:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Owner-initiated explicit action must be checked before Cloudflare access
        shell: bash
        env:
          APPROVED_ACTION: ${{ inputs.action }}
        run: |
          case "$APPROVED_ACTION" in
            CONFIRM_RESUME_VERIFIED_C86C_100|CONFIRM_RESTORE_136C_FROM_C86C_100)
              echo "EXPLICIT_OWNER_ACTION: PASS";;
            *) echo "::error::Default CANCEL - no source or Cloudflare requests."; exit 2;;
          esac
      - name: Checkout reviewed main, credentials not stored
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify protected canonical repository invariants
        run: python3 scripts/check-project-invariants.py
      - name: Offline strict HTML/traffic/rollback regression suite
        run: |
          node --check web/app.js
          node --test worker/test/*.test.mjs
          python3 -m unittest discover -s scripts -p 'test_magnetra_auto_pause_resume.py'
      - name: Setup pinned Wrangler environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check existing immutable version secrets without uploading
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAGNETRA_AUTO_PAUSE_RESUME_ACTION: ${{ inputs.action }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing existing Cloudflare credentials; no traffic write."
            exit 1
          }
          python3 scripts/resume_magnetra_auto_pause_c86c.py
