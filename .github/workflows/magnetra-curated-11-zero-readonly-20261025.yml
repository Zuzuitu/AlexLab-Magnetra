name: Magnetra Curated 11 Staged Zero Readonly Diagnostic
on:
  pull_request:
    paths:
      - scripts/diagnose_curated_11_zero_readonly_20261025.py
      - scripts/test_diagnose_curated_11_zero_readonly_20261025.py
      - .github/workflows/magnetra-curated-11-zero-readonly-20261025.yml
  push:
    branches: [main]
    paths:
      - docs/release-events/magnetra-curated-11-zero-diagnostic-20261025.md
permissions:
  contents: read
jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-project-invariants.py
      - run: python3 -m unittest discover -s scripts -p 'test_diagnose_curated_11_zero_readonly_20261025.py' -v
  inspect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[magnetra-curated-11-zero-diagnostic-20261025] ')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          test -s docs/release-events/magnetra-curated-11-zero-diagnostic-20261025.md
          python3 scripts/check-project-invariants.py
          python3 -m unittest discover -s scripts -p 'test_diagnose_curated_11_zero_readonly_20261025.py' -v
      - name: Inspect exact 0% assets, HTML and 46 API catalog (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/diagnose_curated_11_zero_readonly_20261025.py
