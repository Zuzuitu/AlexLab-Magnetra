name: Deploy Magnetra PWA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  deploy:
    # Only an explicit deploy marker at the START of the commit subject can activate
    # push deployment. Mentioning the marker in a PR/commit body is NOT consent.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[deploy-pwa] '))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Check project invariants
        run: python3 scripts/check-project-invariants.py
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify provider contracts and Companion safety
        run: node --test worker/test/*.test.mjs
      - name: Verify BTDigg-only production smoke contract without source calls
        run: python3 -m unittest discover -s scripts -p 'test_btdigg_pwa_live_asset.py' -v
      - name: Validate Cloudflare bundle
        run: npx --yes wrangler@4.45.4 deploy --config worker/wrangler.jsonc --dry-run
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Cloudflare secrets are missing. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets.";
            exit 1;
          }
      - name: Deploy Worker + PWA to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.4 deploy --config worker/wrangler.jsonc
      - name: Verify live production HTTPS, PWA and APIs after deployment
        run: python3 scripts/check-production-smoke.py
      # The owner-approved BTDigg idle recovery release must not trigger a
      # full 46-indexer source audit just to publish its PWA/Worker assets.
      # Other ordinary deployments retain their existing post-release audit.
      - name: Verify BTDigg PWA assets without provider searches
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[deploy-pwa] btdigg-idle-recovery-20261115')
        run: python3 scripts/check-btdigg-pwa-live-asset.py
      - name: Audit all 46 provider search responses (no torrent downloads)
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[deploy-pwa] btdigg-idle-recovery-20261115')
        run: python3 scripts/audit-live-providers.py
