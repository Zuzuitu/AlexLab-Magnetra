name: Magnetra Companion V2 Finite Diagnosis (ZERO TRAFFIC ONLY)

on:
  push:
    branches: [main]
    paths:
      - docs/release-events/companion-v2-diagnostic-20261023.md

permissions:
  contents: read

concurrency:
  group: magnetra-production-traffic-change
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[magnetra-companion-v2-diagnostic-20261023]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require exact diagnostic event marker
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_MESSAGE" == *'[magnetra-companion-v2-diagnostic-20261023]'* ]]
          test -s docs/release-events/companion-v2-diagnostic-20261023.md
      - name: Guard canonical project invariants
        run: python3 scripts/check-project-invariants.py
      - name: Verify synthetic-only status and existing PWA contracts
        run: node --test worker/test/*.test.mjs
      - name: Check Worker bundle syntax and binding before any cloud mutation
        run: npx --yes wrangler@4.102.0 deploy --config worker/wrangler.jsonc --dry-run
      - name: Stage diagnostic version at 0% only, maintain old 100%
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAGNETRA_COMPANION_V2_DIAG_ACTION: CONFIRM_COMPANION_V2_DIAGNOSTIC_ZERO_ONLY_20261023
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/stage_companion_v2_diagnostic.py
