# Owner-approved immutable release. A source-code PR NEVER deploys.
# Only a separately reviewed main push with its unique activation file and
# exact activation marker can begin the 0% -> 5% -> 100% guarded rollout.
name: Magnetra 45 Indexers 50 Results Production (OWNER APPROVAL REQUIRED)
on:
  pull_request:
    paths:
      - scripts/release_pwa_45_indexers_50_20261025.py
      - scripts/test_release_pwa_45_indexers_50_20261025.py
      - .github/workflows/pwa-45-indexers-50-production-20261025.yml
  push:
    branches: [main]
    paths:
      - docs/release-events/pwa-45-indexers-50-production-20261025.md
permissions:
  contents: read
concurrency:
  group: magnetra-production-traffic-change
  cancel-in-progress: false
jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify all project invariants and offline release safety
        run: |
          set -euo pipefail
          python3 scripts/check-project-invariants.py
          python3 -m unittest discover -s scripts -p 'test_release_pwa_45_indexers_50_20261025.py' -v
  guarded-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[magnetra-pwa-45-indexers-50-owner-approve-20261025]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Checkout must happen BEFORE testing the tracked activation file.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Enforce distinct owner-approved activation event before Cloudflare requests
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [[ "$MESSAGE" == *'[magnetra-pwa-45-indexers-50-owner-approve-20261025]'* ]]
          test -s docs/release-events/pwa-45-indexers-50-production-20261025.md
      - name: Offline invariant, rollback and release regression tests
        run: |
          set -euo pipefail
          python3 scripts/check-project-invariants.py
          python3 -m unittest discover -s scripts -p 'test_release_pwa_45_indexers_50_20261025.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full PWA and provider regression suite
        run: |
          set -euo pipefail
          node --test worker/test/*.test.mjs
          node --check web/app.js
          node --check web/i18n.js
          node --check worker/src/index.mjs
      - name: Dry run of immutable release bundle
        run: npx --yes wrangler@4.102.0 deploy --config worker/wrangler.jsonc --dry-run
      - name: Guarded immutable Cloudflare 0% then 5% then 100%, with bounded rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAGNETRA_INDEXERS_45_PAGING_50_RELEASE_ACTION: CONFIRM_MAGNETRA_45_SOURCES_50_RESULTS_RELEASE_20261025
        run: |
          set -euo pipefail
          python3 scripts/release_pwa_45_indexers_50_20261025.py
