name: Magnetra 0Magnet Verified Zero to Five to Full (OWNER ONE SHOT)
on:
  pull_request:
    paths:
      - scripts/promote_0magnet_staged_20261025.py
      - scripts/test_promote_0magnet_staged_20261025.py
      - .github/workflows/0magnet-promote-verified-zero-20261025.yml
  push:
    branches: [main]
    paths:
      - docs/release-events/0magnet-promote-verified-zero-20261025.md
permissions:
  contents: read
concurrency:
  group: magnetra-production-traffic-change
  cancel-in-progress: false
jobs:
  offline-safety-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Exact 100/0 staged candidate and rollback simulations (no mutation)
        run: |
          set -euo pipefail
          python3 scripts/check-project-invariants.py
          python3 -m unittest discover -s scripts -p 'test_promote_0magnet_staged_20261025.py' -v
  guarded-promotion:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[magnetra-0magnet-promote-verified-zero-20261025]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify unique user-approved one-shot activation file
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [[ "$MESSAGE" == *'[magnetra-0magnet-promote-verified-zero-20261025]'* ]]
          test -s docs/release-events/0magnet-promote-verified-zero-20261025.md
      - name: Project invariants + complete offline promotion/rollback safety tests
        run: |
          set -euo pipefail
          python3 scripts/check-project-invariants.py
          python3 -m unittest discover -s scripts -p 'test_promote_0magnet_staged_20261025.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original real PWA and 46-provider contracts
        run: |
          set -euo pipefail
          node --test worker/test/*.test.mjs
          node --check web/app.js
          node --check worker/src/index.mjs
      - name: Controlled immutable traffic promotion and automatic prior stable rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAGNETRA_0MAGNET_PROMOTION_ACTION: CONFIRM_0MAGNET_STAGED_CANDIDATE_PROMOTION_20261025
        run: |
          set -euo pipefail
          python3 scripts/promote_0magnet_staged_20261025.py
