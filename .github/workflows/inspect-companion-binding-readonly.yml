# Manual diagnostic only: zero uploads, zero deployments, no Flud traffic.
name: Inspect Magnetra Companion Service Binding (READ ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check canonical technical invariants
        run: python3 scripts/check-project-invariants.py
      - name: Run offline Cloudflare binding inspection tests
        run: python3 -m unittest discover -s scripts -p 'test_inspect_companion_binding_readonly.py' -v
      - name: Confirm same Cloudflare account and current immutable binding metadata (GET ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/inspect_companion_binding_readonly.py
