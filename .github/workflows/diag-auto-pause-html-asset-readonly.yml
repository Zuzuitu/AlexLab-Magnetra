# One diagnostic read; no version upload, deploy, retries or provider calls.
name: Magnetra Auto Pause HTML Asset Zero Share (READ ONLY)
on:
  push:
    branches:
      - diagnostics/auto-pause-index-asset-readonly
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Protected repository invariants
        run: python3 scripts/check-project-invariants.py
      - name: Real versioned and public HTML static only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/diagnose_auto_pause_index_asset_readonly.py
