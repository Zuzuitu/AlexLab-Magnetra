# ONE-SHOT READ ONLY after owner-triggered 136c exact 0%-slot run.
# No Cloudflare writes, no source retries, no sensitive output, no branch merge.
name: Relevance 136c postflight attribution (READ ONLY)

on:
  push:
    branches:
      - diagnostics/relevance-136c-asset-postflight-readonly

permissions:
  contents: read

jobs:
  one-shot-postflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source with no stored credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify canonical invariants
        run: python3 scripts/check-project-invariants.py
      - name: Inspect fixed Cloudflare metadata and one original-query title E2E
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/diagnose_relevance_136c_postflight_once.py
