name: Build debug APK

# Avoid Android builds on source-only PWA, Rock64, docs, and CI changes.
# Manual workflow_dispatch remains available for a deliberate APK build.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/debug_build.yml'
      - '.github/workflows/staging_build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/debug_build.yml'
      - '.github/workflows/staging_build.yml'
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Check project invariants
      run: python3 scripts/check-project-invariants.py

    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up JetBrains Runtime 21 for Gradle daemon
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '21'
        distribution: 'jetbrains'
        java-package: 'jdk'
        cache: gradle
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Assemle debug APK with gradlew
      run: ./gradlew app:assembleDebug

    - name: Rename APK file to torrentsearch-debug.apk
      run: |
        cd app/build/outputs/apk/debug
        mv app-debug.apk torrentsearch-debug.apk

    - name: Upload debug APK
      uses: actions/upload-artifact@v7.0.1
      with:
        path: app/build/outputs/apk/debug/torrentsearch-debug.apk
        archive: false
        retention-days: 1
