name: Technical memory invariants

on:
  push:
    branches: [ "main", "chore/**", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check project invariants
        run: python3 scripts/check-project-invariants.py

      - name: Compile invariant checker
        run: python3 -m py_compile scripts/check-project-invariants.py
