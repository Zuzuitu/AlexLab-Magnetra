name: Technical memory invariants

on:
  push:
    branches: [ "main", "chore/**", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check project invariants
        run: python3 scripts/check-project-invariants.py

      - name: Compile invariant checker
        run: python3 -m py_compile scripts/check-project-invariants.py

      - name: Test Cloudflare version audit output never leaks secrets
        run: python3 -m unittest discover -s scripts -p 'test_cloudflare_version_audit.py'

      - name: Test new 540b staged Resolve version read-only audit without network
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_fix_stage_audit.py'

      - name: Test guarded Cloudflare zero-percent deployment without external calls
        run: python3 -m unittest discover -s scripts -p 'test_zero_traffic_deployment.py'

      - name: Test guarded 5 percent Cloudflare canary and rollback offline
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_canary.py'

      - name: Test read-only 95/5 canary E2E attribution without network
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_canary_e2e.py'

      - name: Test manual 100 percent Worker promotion and rollback offline
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_release_100.py'

      - name: Test read-only OxTorrent and Torrent9 detail URL shapes without network
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_detail_routes.py'

      - name: Regress owner reported exact OxTorrent Resolve without network
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_exact_oxtorrent_resolve.py'

      - name: Test bounded real-card 2026 Resolve transport without network
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_2026_card_resolve.py'

      - name: Test candidate E2E fingerprint and sanitization offline
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_candidate_e2e.py'

      - name: Test BTDigg one-query production-first differential without network
        run: python3 -m unittest discover -s scripts -p 'test_btdigg_differential.py'
