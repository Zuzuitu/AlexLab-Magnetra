# Read-only, manually triggered: no upload, no deploy, no secret mutation.
name: Inspect Magnetra Cloudflare Version (READ ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check project invariants
        run: python3 scripts/check-project-invariants.py
      - name: Verify read-only parser safety
        run: python3 -m unittest discover -s scripts -p 'test_cloudflare_version_audit.py'
      - name: Read exact Cloudflare version and current deployment (GET only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/alexlab-magnetra"
          # Raw API responses are private and never printed to logs.
          curl --fail --silent --show-error --retry 0 --max-time 20 --proto '=https' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            -o "$tmp/version.json" \
            "$api/versions/249d6767-f4dc-4f4d-bbf7-f57bea2e5554"
          curl --fail --silent --show-error --retry 0 --max-time 20 --proto '=https' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            -o "$tmp/deployments.json" \
            "$api/deployments"
          python3 scripts/inspect_cloudflare_version.py \
            "$tmp/version.json" "$tmp/deployments.json"
