name: PWA and provider contracts

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pwa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Check project invariants
        run: python3 scripts/check-project-invariants.py
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check worker/src/index.mjs && node --check worker/src/query-relevance.mjs && node --check worker/src/eztv-official-api.mjs && node --check worker/src/eztv-rock64.mjs && node --check worker/src/html-rock64.mjs && node --check worker/src/btdigg-rock64.mjs && node --check worker/src/providers.mjs && node --check worker/src/catalog.mjs && node --check worker/src/html-adapters.mjs && node --check worker/src/legacy-specs.mjs && node --check worker/src/legacy-adapters.mjs && node --check worker/src/request-headers.mjs && node --check worker/src/provider-recovery.mjs && node --check worker/src/recovery-strategy.mjs && node --check worker/src/source-audit.mjs && node --check scripts/recovery-plan.mjs && node --check web/app.js && node --check web/sw.js
      - name: Test provider contracts and Companion safety
        run: node --test worker/test/*.test.mjs
      - name: Offline GET-only Flud Companion Cloudflare account and binding audit tests
        run: python3 -m unittest discover -s scripts -p 'test_inspect_companion_binding_readonly.py' -v
      - name: Offline owner-gated immutable Flud Companion rollout and 401 probe tests
        run: python3 -m unittest discover -s scripts -p 'test_release_magnetra_companion_binding_20261023.py' -v
      - name: Offline manual 540b full promotion and rollback regression tests
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_fix_full_100.py'
      - name: Offline exact 136c relevance zero-slot regression tests
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_relevance_136c_slot.py'
      - name: Offline 136c relevance 5 percent canary and manual restore regression tests
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_relevance_136c_canary.py'
      - name: Offline 136c full release and separately authorized rollback regression tests
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_relevance_136c_full.py'
      - name: Offline single-action reversible source-health PWA release gates
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_auto_pause_release.py'
      - name: Offline existing zero-share resume and Cloudflare HTML beacon safety gates
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_auto_pause_resume.py'
      - name: Offline owner-approved curated PWA immutable release and rollback gates
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_curated_ui_release.py' -v
      - name: Offline 12-indexer RO/IT owner release safety and rollback
        run: python3 -m unittest discover -s scripts -p 'test_release_magnetra_ro_it_12.py' -v
      - name: Offline guarded TheRarBg source-owned magnet release safety
        run: python3 -m unittest discover -s scripts -p 'test_release_magnetra_therarbag_magnet.py' -v
      - name: Offline TheRarBg edge-403 diagnostic and resolver stage regression tests
        run: python3 -m unittest discover -s scripts -p 'test_therarbag_readonly_diagnostic.py' -v
      - name: Offline 056d TheRarBg source-cache-link rollout and rollback gates
        run: python3 -m unittest discover -s scripts -p 'test_release_magnetra_therarbag_cache_link_20261022.py' -v
      - name: Offline new 8c4e TheRarBg stage release and reversible canary gates
        run: python3 -m unittest discover -s scripts -p 'test_release_magnetra_therarbag_error_stages_20261022.py' -v
      - name: Offline 27-indexer AnimeTosho Mikan release and rollback gates
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_hide_anime_mikan_release.py' -v
      - name: Offline exact 6dad zero-slot resume and bounded HTML propagation
        run: python3 -m unittest discover -s scripts -p 'test_resume_magnetra_hide_anime_mikan.py' -v
      - name: Verify offline 46-provider recovery strategy report
        run: node scripts/recovery-plan.mjs --summary
      - name: Test Rock64 BTDigg gateway (loopback only, no external requests)
        run: python3 -m unittest discover -s rock64 -p 'test_*.py' -v
      - name: Validate Rock64 gateways Python syntax and guarded installers
        run: python3 -m py_compile rock64/btdigg_gateway.py rock64/check-btdigg.py rock64/eztv_gateway.py rock64/check-eztv-gateway.py rock64/probe-more-indexers.py rock64/diagnose-eztv-filter.py rock64/probe-indexer-followup.py rock64/probe-redirect-candidates.py rock64/probe-result-details.py rock64/magnetra_html_egress.py rock64/magnetra_gateway.py rock64/check-magnetra-gateway.py rock64/check-magnetra-html.py rock64/wait-magnetra-8798.py && bash -n rock64/install-btdigg.sh rock64/update-btdigg.sh rock64/install-eztv.sh rock64/check-shared-tunnel.sh rock64/install-magnetra-gateway.sh rock64/upgrade-magnetra-gateway.sh
      - name: Preflight pinned Wrangler CLI for real Cloudflare selector runtime
        run: npx --yes wrangler@4.45.4 --version
      - name: Validate provider selectors in real Cloudflare workerd runtime
        run: |
          npx --yes wrangler@4.45.4 dev --config worker/test/wrangler-selector.jsonc --port 8789 > "$RUNNER_TEMP/magnetra-selectors.log" 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl --max-time 4 -fsS http://127.0.0.1:8789/ > "$RUNNER_TEMP/magnetra-selector-results.json"; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.ok!==true||x.checked!==35||x.invalid?.length)process.exit(1)' "$RUNNER_TEMP/magnetra-selector-results.json"; then
                cat "$RUNNER_TEMP/magnetra-selector-results.json"
                exit 0
              fi
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/magnetra-selectors.log"
          test -f "$RUNNER_TEMP/magnetra-selector-results.json" && cat "$RUNNER_TEMP/magnetra-selector-results.json"
          exit 1
      - name: Verify Cloudflare Worker bundle and static PWA assets
        run: npx --yes wrangler@4.45.4 deploy --config worker/wrangler.jsonc --dry-run --outdir .wrangler-magnetra-preview
