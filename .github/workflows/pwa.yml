name: PWA and provider contracts

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pwa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Check project invariants
        run: python3 scripts/check-project-invariants.py
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check worker/src/index.mjs && node --check worker/src/providers.mjs && node --check worker/src/catalog.mjs && node --check worker/src/html-adapters.mjs && node --check worker/src/legacy-specs.mjs && node --check worker/src/legacy-adapters.mjs && node --check web/app.js && node --check web/sw.js
      - name: Test provider contracts and Companion safety
        run: node --test worker/test/*.test.mjs
      - name: Validate provider selectors in real Cloudflare workerd runtime
        run: |
          npx --yes wrangler@4.45.4 dev worker/test/selectors.worker.mjs --port 8789 --compatibility-date 2026-10-01 > "$RUNNER_TEMP/magnetra-selectors.log" 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl --max-time 4 -fsS http://127.0.0.1:8789/ > "$RUNNER_TEMP/magnetra-selector-results.json"; then
              cat "$RUNNER_TEMP/magnetra-selector-results.json"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/magnetra-selectors.log"
          test -f "$RUNNER_TEMP/magnetra-selector-results.json" && cat "$RUNNER_TEMP/magnetra-selector-results.json"
          exit 1
      - name: Verify Cloudflare Worker bundle and static PWA assets
        run: npx --yes wrangler@4.45.4 deploy --config worker/wrangler.jsonc --dry-run --outdir .wrangler-magnetra-preview
