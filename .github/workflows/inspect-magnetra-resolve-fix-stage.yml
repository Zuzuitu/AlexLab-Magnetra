# Owner-triggered metadata audit only. NO Cloudflare writes, no source queries.
# Validate immutable 540b staged version bindings before ANY deployment slot.
name: Inspect Magnetra Resolve Fix Stage (READ ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnetra-inspect-resolve-fix-stage
  cancel-in-progress: false

jobs:
  verify-stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Protect project invariants
        run: python3 scripts/check-project-invariants.py
      - name: Verify strict staged version audit with offline fixtures
        run: python3 -m unittest discover -s scripts -p 'test_magnetra_fix_stage_audit.py'
      - name: Read exact staged version bindings and unchanged production split (GET only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 scripts/inspect_magnetra_fix_stage.py
