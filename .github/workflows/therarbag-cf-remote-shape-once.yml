# One ephemeral Cloudflare remote-preview source inspection; never changes
# the production alexlab-magnetra deployment or traffic percentages.
# Triggered only by changing this file on its exact diagnostic branch.
name: Magnetra TheRarBg CF Remote Shape Once

on:
  push:
    branches:
      - diagnostics/therarbag-worker-shape-20261024
    paths:
      - .github/workflows/therarbag-cf-remote-shape-once.yml

permissions:
  contents: read

concurrency:
  group: magnetra-therarbag-cf-preview-once-20261024
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'Zuzuitu/AlexLab-Magnetra' && github.ref == 'refs/heads/diagnostics/therarbag-worker-shape-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Offline invariants and sanitized shape regression
        run: |
          python3 scripts/check-project-invariants.py
          node --test worker/test/therarbag-worker-shape.test.mjs
      - name: Start temporary CF preview, make exactly one source detail Resolve
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "DIAGNOSTIC_STOP: CLOUDFLARE_PREVIEW_CREDENTIALS_MISSING"
            exit 2
          fi
          tmp="$(mktemp -d)"
          worker_pid=""
          cleanup(){
            if [[ -n "$worker_pid" ]]; then kill "$worker_pid" 2>/dev/null || true; fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          npx --yes wrangler@4.45.4 dev --remote --config worker/wrangler.jsonc \
            --port 8789 --log-level error > "$tmp/remote-preview.log" 2>&1 &
          worker_pid="$!"
          ready=0
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error --retry 0 --max-time 3 \
              -o "$tmp/health.json" http://127.0.0.1:8789/api/health \
              2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "DIAGNOSTIC_STOP: CF_REMOTE_PREVIEW_UNAVAILABLE"
            exit 2
          fi
          printf '%s' '{"provider":"therarbag","details":"https://therarbg.com/post-detail/95bf8b/2026-10-20-cyberpunk-edgerunners-2-original-series-soundtrack-flac-44-1khz-24bit/"}' > "$tmp/request.json"
          # A single HTTP request to the temporary Worker, which performs
          # exactly one original-source detail fetch. No followup or retry.
          status="$(curl --silent --show-error --retry 0 --max-time 24 \
            -H 'content-type: application/json' \
            -H 'x-magnetra-shape-diagnostic: 20261024-readonly-exact' \
            --data-binary "@$tmp/request.json" \
            -o "$tmp/response.json" -w '%{http_code}' \
            http://127.0.0.1:8789/api/resolve)" || {
            echo "DIAGNOSTIC_STOP: CF_REMOTE_RESOLVE_TRANSPORT_UNAVAILABLE"
            exit 2
          }
          python3 - "$tmp/response.json" "$status" <<'PY'
          import json, re, sys
          filename, status = sys.argv[1:]
          try:
              body=json.load(open(filename,encoding="utf-8"))
              if not isinstance(body,dict): raise ValueError("not object")
          except (OSError,ValueError):
              print("CF_REMOTE_RESULT: NON_JSON")
              sys.exit(2)
          safe_stages={
              "REWRITER_MATCHED_BUT_REJECTED",
              "MAGNET_HTML_PRESENT_REWRITER_MISSED",
              "LABELED_BTIH_PRESENT_FALLBACK_REJECTED",
              "INFO_HASH_LABEL_VALUE_UNAVAILABLE",
              "MAGNET_CONTROL_WITHOUT_MARKUP_LINK",
              "SOURCE_DETAIL_MARKERS_ABSENT",
              "SOURCE_HTML_UNEXPECTED"
          }
          allowed_codes={
              "DETAIL_NO_BTIH","SOURCE_HTTP_403","SOURCE_HTTP_404","SOURCE_HTTP_429",
              "SOURCE_HTTP_500","SOURCE_HTTP_502","SOURCE_HTTP_503","SOURCE_HTTP_504",
              "SOURCE_HTTP_OTHER","SOURCE_CHALLENGE","SOURCE_REDIRECT",
              "SOURCE_TIMEOUT","SOURCE_NETWORK","SOURCE_PAGE_TOO_LARGE",
              "DETAIL_URL_REJECTED","WORKER_RUNTIME","RESOLVE_UNKNOWN"
          }
          marker=body.get("shapeDiagnosticVersion")
          stage=body.get("shapeStage")
          error_code=body.get("code")
          print("CF_REMOTE_HTTP:",status if status in ("200","502") else "OTHER")
          print("CF_REMOTE_DIAGNOSTIC_MARKER:",
                "EXPECTED" if marker=="THERARBAG_WORKER_SHAPE_V1" else "ABSENT_OR_INVALID")
          print("CF_REMOTE_ERROR_CLASS:",error_code if error_code in allowed_codes else "NONE_OR_UNCLASSIFIED")
          print("CF_REMOTE_HTML_SHAPE:",stage if stage in safe_stages else "NONE_OR_UNCLASSIFIED")
          magnet=body.get("magnet")
          magnet_ok=isinstance(magnet,str) and bool(re.match(
              r"^magnet:\?xt=urn:btih:(?:[a-fA-F0-9]{40}|[a-zA-Z2-7]{32})(?:&|$)",magnet))
          print("CF_REMOTE_VALID_BTIH:",magnet_ok)
          if marker!="THERARBAG_WORKER_SHAPE_V1" or not (status=="502" or magnet_ok):
              sys.exit(2)
          PY
